<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#287d16">
    <title>You’re offline | CampusMarket KE</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #fafbf8; color: #24351d; font-family: system-ui, sans-serif; }
      main { width: min(100%, 440px); padding: 32px; border: 1px solid #e3e8df; border-radius: 16px; background: white; text-align: center; }
      img { width: 72px; height: 72px; }
      h1 { margin: 16px 0 8px; font-size: 24px; }
      p { color: #697565; line-height: 1.6; }
      button { margin-top: 10px; border: 0; border-radius: 9px; padding: 12px 18px; background: #287d16; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="">
      <h1>You’re offline</h1>
      <p>CampusMarket needs an internet connection to load listings. Reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
